name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phone-agent:
    name: Phone Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check phone_agent tests
      - name: Run tests
        run: pytest tests/ -v --tb=short

  mcp-server:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
